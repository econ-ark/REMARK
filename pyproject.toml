[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-ark-remark"
version = "0.1.0"
description = "REMARK's command-line tool: pull, lint, build and execute the REMARK catalog's reproducible projects"
readme = "CLI-GUIDE.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
remark = "remark.cli:main"

[project.urls]
Homepage = "https://github.com/econ-ark/REMARK"

[tool.setuptools]
packages = ["remark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: needs a working docker daemon (skipped when there is none)"]
